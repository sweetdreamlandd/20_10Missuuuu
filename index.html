<!DOCTYPE html>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #ffd1dc 40%, #e0f2fe 100%);
            touch-action: manipulation;
        }
        
        .font-handwriting {
            font-family: 'Dancing Script', cursive;
        }

        .font-title {
            font-family: 'Quicksand', sans-serif;
        }

        /* Glassmorphism panel */
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.75);
            box-shadow: 0 20px 40px -15px rgba(244, 114, 182, 0.3);
        }

        /* Floating background elements */
        .floating-bg {
            animation: floating 6s ease-in-out infinite alternate;
        }
        @keyframes floating {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(5deg); }
        }

        /* Pulse hint animation */
        .pulse-click {
            animation: pulseGlow 2s infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* Watering Can Animation */
        .watering-can-tilt {
            animation: tiltWaterCan 1.2s ease-in-out infinite alternate;
        }
        @keyframes tiltWaterCan {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-35deg); }
        }

        /* Flower Flying Animation to Pot Arrangement */
        @keyframes flyToPot {
            0% { transform: scale(0.2) translate(0, 80px) rotate(-15deg); opacity: 0; }
            60% { transform: scale(1.15) translate(0, -20px) rotate(5deg); opacity: 0.9; }
            100% { transform: scale(1) translate(0, 0) rotate(0deg); opacity: 1; }
        }

        .animate-fly-to-pot {
            animation: flyToPot 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Ribbon entrance */
        @keyframes popRibbon {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            80% { transform: scale(1.15) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .animate-pop-ribbon {
            animation: popRibbon 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Canvas overlay */
        #fxCanvas {
            pointer-events: none;
        }
    </style>
</head>

    <script>
        /* ==========================================================================

        // Danh sách lời chúc đồng bộ với việc cắm từng bông hoa tulip

            {
                title: "Chúc bạn trọn vẹn hạnh phúc ❤️",
                desc: "Gửi bạn bó hoa này trước nheee",
                color: "#E11D48"
            }
        ];

        /* 
           Cấu hình vị trí cắm hoa tulip XEN KẼ NẰM TRONG CHẬU:
           Phân bố theo 3 tầng (layer): 'back' (sau chậu), 'middle' (trung tâm chậu), 'front' (trước và tràn nhẹ viền chậu)
           Tọa độ (x, y) tính theo gốc miệng chậu (150, 280)
        */
        const TULIP_ARRANGEMENT = [
            // Bông 1: Trung tâm cao nhỉnh lên (Màu Hồng Pastel)
            { layer: 'middle', x: 150, y: 150, stemControl: { cx: 148, cy: 220 }, scale: 1.05, rot: -2, mainColor: '#FB7185', subColor: '#FDA4AF' },
            
            // Bông 2: Lệch trái vừa, tầng trung (Màu Đỏ Hồng)
            { layer: 'middle', x: 110, y: 175, stemControl: { cx: 125, cy: 230 }, scale: 0.95, rot: -16, mainColor: '#F43F5E', subColor: '#FB7185' },
            
            // Bông 3: Lệch phải vừa, tầng sau cao (Màu Tím Mộng Mơ)
            { layer: 'back', x: 190, y: 160, stemControl: { cx: 170, cy: 220 }, scale: 0.98, rot: 18, mainColor: '#C084FC', subColor: '#E9D5FF' },
            
            // Bông 4: Lệch trái cao rủ nhẹ (Màu Vàng Ấm)
            { layer: 'back', x: 75, y: 185, stemControl: { cx: 105, cy: 235 }, scale: 0.9, rot: -28, mainColor: '#FBBF24', subColor: '#FEF08A' },
            
            // Bông 5: Lệch phải trước, tầng thấp tràn viền (Màu Cam San Hô)
            { layer: 'front', x: 220, y: 200, stemControl: { cx: 185, cy: 245 }, scale: 0.92, rot: 25, mainColor: '#FB923C', subColor: '#FFEDD5' },
            
            // Bông 6: Tầng trước chính giữa thấp điểm xuyết (Màu Trắng Hồng Tinh Khôi)
            { layer: 'front', x: 135, y: 215, stemControl: { cx: 142, cy: 250 }, scale: 0.88, rot: -8, mainColor: '#F472B6', subColor: '#FFF1F2' },
            
            // Bông 7: Tầng trước lệch phải trung tâm vươn cao đẹp mắt (Màu Đỏ Thắm)
            { layer: 'front', x: 170, y: 190, stemControl: { cx: 160, cy: 240 }, scale: 0.92, rot: 10, mainColor: '#E11D48', subColor: '#FDA4AF' }
        ];

        /* ==========================================================================
           2. ÂM THANH SỐNG ĐỘNG BẰNG WEB AUDIO API
           ========================================================================== */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let soundEnabled = true;

        // Hàm phát nhạc nền
function playBackgroundMusic() {
    const bgMusic = document.getElementById('bgMusic');
    if (bgMusic && bgMusic.paused) {
        bgMusic.volume = 0.5; // Đặt âm lượng (từ 0.0 đến 1.0, ở đây là 50%)
        bgMusic.play().then(() => {
            console.log("Nhạc nền đang phát");
        }).catch(error => {
            console.log("Chưa thể phát nhạc tự động:", error);
        });
    }
}
function toggleBackgroundMusic() {
    const bgMusic = document.getElementById('bgMusic');
    if (!bgMusic) return;

    if (bgMusic.paused) {
        // Nếu đang dừng -> Phát nhạc
        bgMusic.volume = 0.5;
        bgMusic.play().then(() => {
            console.log("Nhạc nền đang phát");
        }).catch(error => {
            console.log("Không thể phát nhạc:", error);
        });
    } else {
        // Nếu đang phát -> Dừng nhạc
        bgMusic.pause();
        console.log("Nhạc nền đã dừng");
    }
}
        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            
            if (!audioCtx) return;
            
            const now = audioCtx.currentTime;

            if (type === 'click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const musicBtn = document.getElementById('soundToggleBtn');
if (musicBtn) {
    musicBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // Tránh bị lan sự kiện click sang màn hình
        toggleBackgroundMusic();
    });
}
                osc.type = 'sine';
                osc.frequency.setValueAtTime(380, now);
                osc.frequency.exponentialRampToValueAtTime(760, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.08);

            } else if (type === 'water') {
                const bufferSize = audioCtx.sampleRate * 0.6;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                const whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1100, now);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                whiteNoise.connect(filter);
                filter.connect(audioCtx.destination);
                whiteNoise.start(now);
                whiteNoise.stop(now + 0.6);

            } else if (type === 'bloom') {
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                    gain.gain.setValueAtTime(0.18, now + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.45);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.45);
                });
            } else if (type === 'fanfare') {
                const chord = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C E G C E
                chord.forEach((freq) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 1.4);
                });
            }
        }

        /* ==========================================================================
           3. HỆ THỐNG HẠT PARTICLE VÀ PHÁO HOA TRÁI TIM (CANVAS)
           ========================================================================== */
        const canvas = document.getElementById('fxCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, kind) {
                this.x = x;
                this.y = y;
                this.kind = kind; // 'heart', 'water', 'sparkle'
                this.life = 1;

                if (kind === 'heart') {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 5 + 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed - 2;
                    this.size = Math.random() * 12 + 8;
                    this.color = `hsl(${Math.random() * 40 + 330}, 100%, 65%)`;
                    this.decay = Math.random() * 0.015 + 0.01;
                } else if (kind === 'water') {
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = Math.random() * 4 + 3;
                    this.size = Math.random() * 3 + 2;
                    this.color = '#60A5FA';
                    this.decay = 0.03;
                } else {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 4 + 1;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.size = Math.random() * 4 + 2;
                    this.color = '#FBBF24';
                    this.decay = 0.02;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                if (this.kind === 'water') this.vy += 0.15;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                if (this.kind === 'heart') {
                    ctx.font = `${this.size}px serif`;
                    ctx.fillText('❤️', this.x, this.y);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function spawnWater(x, y) {
            for (let i = 0; i < 4; i++) particles.push(new Particle(x, y, 'water'));
        }

        function spawnHeartBurst(x, y, count = 30) {
            for (let i = 0; i < count; i++) particles.push(new Particle(x, y, 'heart'));
        }

        function renderParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(renderParticles);
        }
        renderParticles();

        /* ==========================================================================
           4. ĐIỀU KHIỂN LUỒNG CÂU CHUYỆN & CẮM HOA VÀO CHẬU (STORY FLOW)
           ========================================================================== */
        
        const SCREEN_START = 0;
        const SCREEN_SOW = 1;
        const SCREEN_WATER = 2;
        const SCREEN_BLOOM_FIRST = 3;
        const SCREEN_WISHES_START = 4;

        let currentScreen = SCREEN_START;
        let wishIndex = 0;
        let isAnimating = false;

        // Elements
        const seedGroup = document.getElementById('seedGroup');
        const stem = document.getElementById('stem');
        const leafLeft = document.getElementById('leafLeft');
        const leafRight = document.getElementById('leafRight');
        const singleTulip = document.getElementById('singleTulip');
        const singlePlantGroup = document.getElementById('singlePlantGroup');
        const wateringCan = document.getElementById('wateringCan');
        const ribbonGroup = document.getElementById('ribbonGroup');

        // Layers for Interleaved Tulips
        const layerTulipsBack = document.getElementById('layerTulipsBack');
        const layerTulipsMiddle = document.getElementById('layerTulipsMiddle');
        const layerTulipsFront = document.getElementById('layerTulipsFront');

        // UI Text
        const mainMessage = document.getElementById('mainMessage');
        const subMessage = document.getElementById('subMessage');
        const badgeText = document.getElementById('badgeText');
        const badgeIcon = document.getElementById('badgeIcon');
        const clickHintText = document.getElementById('clickHintText');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const appContainer = document.getElementById('appContainer');

        // Hàm tạo phần tử Bông hoa Tulip cắm trong chậu theo SVG
        function createTulipSVGElement(config) {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.classList.add('animate-fly-to-pot');

            // Gốc cắm xuất phát từ lòng đất trong chậu (150, 280)
            const potBaseX = 150 + (config.x - 150) * 0.3;
            const potBaseY = 282;

            g.innerHTML = `
                <!-- Stem curved naturally into pot -->
                <path d="M ${potBaseX} ${potBaseY} Q ${config.stemControl.cx} ${config.stemControl.cy} ${config.x} ${config.y + 25}" 
                      fill="none" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round"/>
                
                <!-- Leaves on stem -->
                <path d="M ${config.stemControl.cx} ${config.stemControl.cy} Q ${config.stemControl.cx - 15} ${config.stemControl.cy - 10} ${config.stemControl.cx - 22} ${config.stemControl.cy + 5} Q ${config.stemControl.cx - 8} ${config.stemControl.cy + 15} ${config.stemControl.cx} ${config.stemControl.cy}" 
                      fill="#22C55E" opacity="0.9"/>

                <!-- Tulip Flower Head -->
                <g transform="translate(${config.x}, ${config.y}) scale(${config.scale}) rotate(${config.rot})">
                    <!-- Outer Petals -->
                    <path d="M -16 10 C -25 -20 -12 -45 0 -50 C 12 -45 25 -20 16 10 Z" fill="${config.mainColor}"/>
                    <path d="M -20 5 C -30 -15 -18 -40 -5 -45 C -2 -20 -10 0 -20 5 Z" fill="${config.mainColor}" opacity="0.9"/>
                    <path d="M 20 5 C 30 -15 18 -40 5 -45 C 2 -20 10 0 20 5 Z" fill="${config.mainColor}" opacity="0.95"/>
                    <!-- Inner Petal highlight -->
                    <path d="M -10 10 C -15 -15 0 -35 0 -35 C 0 -35 15 -15 10 10 Z" fill="${config.subColor}"/>
                    <path d="M -4 -20 C -8 -35 0 -42 0 -42 C 0 -42 8 -35 4 -20 Z" fill="#FFF" opacity="0.4"/>
                </g>
            `;
            return g;
        }

        // Thêm Tulip vào layer tương ứng (xen kẽ trước/sau/giữa)
        function addTulipToPotArrangement(index) {
            const config = TULIP_ARRANGEMENT[index % TULIP_ARRANGEMENT.length];
            const tulipElem = createTulipSVGElement(config);

            if (config.layer === 'back') {
                layerTulipsBack.appendChild(tulipElem);
            } else if (config.layer === 'front') {
                layerTulipsFront.appendChild(tulipElem);
            } else {
                layerTulipsMiddle.appendChild(tulipElem);
            }
        }

        // Xử lý sự kiện click chuyển screen
        function handleScreenAdvance() {
            if (isAnimating) return;

            initAudio();
            playBackgroundMusic();
            if (currentScreen === SCREEN_START) {
                // Chuyển sang màn gieo hạt vào chậu
                currentScreen = SCREEN_SOW;
                playSound('click');
                
                badgeIcon.textContent = '🌱';
                badgeText.textContent = 'Bước 1: Gieo Hạt Vao Chậu';
                mainMessage.textContent = 'Gieo hạt mầm yêu thương vào chậu đất ấm';
                subMessage.textContent = 'Hạt mầm nhỏ bé ấp ủ những tình cảm chân thành...';

                isAnimating = true;
                seedGroup.setAttribute('opacity', '1');
                seedGroup.setAttribute('transform', 'translate(150, 120)');

                setTimeout(() => {
                    seedGroup.style.transition = 'transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    seedGroup.setAttribute('transform', 'translate(150, 280) scale(0.6)');
                    setTimeout(() => {
                        seedGroup.setAttribute('opacity', '0');
                        isAnimating = false;
                    }, 800);
                }, 100);

            } else if (currentScreen === SCREEN_SOW) {
                // Chuyển sang tưới nước
                currentScreen = SCREEN_WATER;
                playSound('water');

                badgeIcon.textContent = '💧';
                badgeText.textContent = 'Bước 2: Tưới Nước Mát Lành';
                mainMessage.textContent = 'Tưới những giọt nước đong đầy vắt trong';
                subMessage.textContent = 'Để hạt mầm từ từ thức giấc dưới vạt nắng xuân...';

                wateringCan.classList.remove('opacity-0', 'pointer-events-none');
                wateringCan.classList.add('opacity-100');

                const svgRect = document.getElementById('stageSvg').getBoundingClientRect();
                const rx = svgRect.left + svgRect.width * 0.72;
                const ry = svgRect.top + svgRect.height * 0.22;

                let c = 0;
                const interval = setInterval(() => {
                    spawnWater(rx, ry);
                    c++;
                    if (c > 20) clearInterval(interval);
                }, 50);

                setTimeout(() => {
                    wateringCan.classList.remove('opacity-100');
                    wateringCan.classList.add('opacity-0', 'pointer-events-none');
                }, 1500);

            } else if (currentScreen === SCREEN_WATER) {
                // Chuyển sang hoa nở mầm đầu tiên
                currentScreen = SCREEN_BLOOM_FIRST;
                playSound('bloom');

                badgeIcon.textContent = '🌷';
                badgeText.textContent = 'Bước 3: Mầm Hoa Hé Nở';
                mainMessage.textContent = 'Bông Tulip rực rỡ đầu tiên đã vươn lên!';
                subMessage.textContent = 'Sẵn sàng đón nhận vườn hoa ngát hương...';

                isAnimating = true;
                
                stem.setAttribute('d', 'M 150 282 Q 148 220 150 150');
                leafLeft.setAttribute('opacity', '1');
                leafLeft.setAttribute('transform', 'translate(150, 230) scale(1)');
                leafRight.setAttribute('opacity', '1');
                leafRight.setAttribute('transform', 'translate(150, 200) scale(1)');

                setTimeout(() => {
                    singleTulip.setAttribute('opacity', '1');
                    singleTulip.setAttribute('transform', 'translate(150, 150) scale(1)');
                    spawnHeartBurst(window.innerWidth / 2, window.innerHeight * 0.4, 20);
                    isAnimating = false;
                }, 600);

            } else if (currentScreen === SCREEN_BLOOM_FIRST || currentScreen === SCREEN_WISHES_START) {
                // MÀN ĐỌC LỜI CHÚC & CẮM HOA XEN KẼ VÀO CHẬU
                currentScreen = SCREEN_WISHES_START;

                if (wishIndex < WISHES.length) {
                    const wish = WISHES[wishIndex];
                    playSound('bloom');

                    // Ẩn mầm đơn ban đầu để chuyển sang chậu hoa cắm đan xen nhiều lớp
                    if (wishIndex === 0) {
                        singlePlantGroup.style.transition = 'opacity 0.4s';
                        singlePlantGroup.style.opacity = '0';
                    }

                    // Cắm thêm 1 bông tulip mới vào chậu theo tầng xen kẽ
                    addTulipToPotArrangement(wishIndex);

                    // Hiệu ứng pháo tim
                    const svgRect = document.getElementById('stageSvg').getBoundingClientRect();
                    spawnHeartBurst(svgRect.left + svgRect.width * 0.5, svgRect.top + svgRect.height * 0.4, 15);

                    // Cập nhật giao diện lời chúc
                    badgeIcon.textContent = '💌';
                    badgeText.textContent = `Lời chúc ${wishIndex + 1}/${WISHES.length}`;
                    mainMessage.textContent = wish.title;
                    mainMessage.style.color = wish.color;
                    subMessage.textContent = wish.desc;

                    wishIndex++;

                } else {
                    // MÀN HOÀN THÀNH: CHẬU HOA XEN KẼ RỰC RỠ & NƠ LỤA TRANG TRÍ
                    playSound('fanfare');

                    // Hiện nơ lụa thắt chậu hoa
                    ribbonGroup.setAttribute('opacity', '1');
                    ribbonGroup.classList.add('animate-pop-ribbon');

                    badgeIcon.textContent = '👑';
                    badgeText.textContent = '20/10 Trọn Vẹn Yêu Thương';
                    mainMessage.textContent = 'Chậu Hoa Tulip Hoàn Hảo Dành Tặng Bạn! 🎉';
                    mainMessage.style.color = '#E11D48';
                    subMessage.textContent = 'Chúc bạn một ngày 20-10 ngập tràn niềm vui, luôn tự tin, tỏa sáng và ngát hương như chậu hoa tulip rực rỡ này!';

                    clickHintText.textContent = 'Chạm để ngắm lại chậu hoa tuyệt đẹp';

                    // Bắn pháo hoa trái tim chúc mừng
                    for (let i = 0; i < 6; i++) {
                        setTimeout(() => {
                            spawnHeartBurst(
                                Math.random() * window.innerWidth * 0.8 + window.innerWidth * 0.1,
                                Math.random() * window.innerHeight * 0.5 + window.innerHeight * 0.1,
                                32
                            );
                        }, i * 280);
                    }

                    // Reset về vòng lặp lời chúc nếu click tiếp
                    wishIndex = 0;
                }
            }
        }

        // Sự kiện click/tap toàn bộ app
        appContainer.addEventListener('click', handleScreenAdvance);

        // Sound Toggle
        soundToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.className = 'fa-solid fa-volume-high text-lg';
                initAudio();
                playSound('click');
            } else {
                soundIcon.className = 'fa-solid fa-volume-xmark text-lg text-gray-400';
            }
        });
    </script>
</body>
</html>
